<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پلی لیست محمد</title><style>body{margin:0;background:#080808;color:#fff;font-family:Tahoma,Arial,sans-serif}*{box-sizing:border-box}.app{max-width:900px;margin:auto;padding:22px}.hero{padding:28px;border-radius:24px;background:linear-gradient(135deg,#171717,#090909);box-shadow:0 0 50px #000}.hero h1{margin:0 0 8px;font-size:30px}.hero p{color:#aaa}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:14px;padding:12px 16px;background:#fff;color:#111;font-weight:bold;cursor:pointer}.btn.dark{background:#222;color:#fff}.player{margin-top:15px;padding:20px;border-radius:20px;background:#111}.now{font-size:20px;font-weight:bold}.controls{display:flex;justify-content:center;gap:12px;margin:18px}.circle{width:52px;height:52px;border-radius:50%;border:0;background:#242424;color:#fff;font-size:20px;cursor:pointer}.play{background:#fff;color:#000}.bar{width:100%}.list{margin-top:20px;display:grid;gap:9px}.track{padding:15px;border-radius:14px;background:#151515;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:.2s}.track:hover,.track.active{background:#242424;transform:translateX(-3px)}.tag{color:#777;font-size:12px}.visual{height:150px;margin:20px 0;border-radius:18px;overflow:hidden;background:radial-gradient(circle,#333,#080808);position:relative}.orb{position:absolute;width:80px;height:80px;border-radius:50%;background:#fff;filter:blur(10px);left:50%;top:50%;transform:translate(-50%,-50%);animation:pulse 1.3s infinite alternate}@keyframes pulse{to{width:125px;height:125px;opacity:.25}}input[type=file]{display:none}.artist{display:flex;gap:18px;align-items:center;margin-bottom:8px}.artist img{width:92px;height:92px;object-fit:cover;border-radius:22px;border:2px solid #333;box-shadow:0 10px 35px #000}.artist h1{margin:0 0 8px}.artist p{margin:0;color:#aaa}.cover{width:52px;height:52px;object-fit:cover;border-radius:12px;margin-left:12px;box-shadow:0 5px 18px #000}.track{justify-content:flex-start}.track .info{flex:1}</style></head><body><div class="app"><section class="hero"><div class="artist"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Amir%20Tataloo%20in%20Tbilisi%202018%20by%20Pouria%20Afkhami%20pixoos%2001.jpg?width=700" alt="Amir Tataloo"><div><h1>🎧 پلی لیست محمد</h1><p>پلی‌لیست تتلو با عکس، انیمیشن و امکان اضافه‌کردن آهنگ</p></div></div><p>پلی‌لیست شخصی با انیمیشن و امکان اضافه‌کردن آهنگ‌های خودت</p><div class="buttons"><label class="btn" for="files">➕ افزودن آهنگ</label><button class="btn dark" id="clear">پاک کردن آهنگ‌های اضافه</button><input id="files" type="file" accept="audio/*" multiple></div><div class="visual"><div class="orb"></div></div><div class="player"><div class="now" id="now">یه سرم به ما بزن</div><div class="tag" id="meta">آماده پخش</div><div class="controls"><button class="circle" id="prev">⏮</button><button class="circle play" id="play">▶</button><button class="circle" id="next">⏭</button></div><input class="bar" id="progress" type="range" min="0" max="100" value="0"><audio id="audio"></audio></div><div class="list" id="list"></div></section></div><script>
const titles=['یه سرم به ما بزن','من ۲','گرگ ۳','گرگ ۲','من ۳','صدی چن','عجب','دل من هواتو کرد','با تو','خار','گلچین تتلو ۱','گلچین تتلو ۲','گلچین تتلو ۳','گلچین تتلو ۴'];
const realCovers={'یه سرم به ما بزن':'https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/95/33/29/953329f5-daa8-2d0f-b057-12bcae2c2ba1/195448334661.jpg/1400x1400bb.jpg','گرگ ۳':'https://static.qobuz.com/images/covers/fb/hb/xukff1tihhbfb_600.jpg','گرگ ۲':'https://iscale.iheart.com/catalog/album/98756628','من ۳':'https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/56/f5/38/56f538fd-592a-dbe9-cc41-43e13ec12b2f/195079571282.jpg/1400x1400bb.jpg','صدی چن':'https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/f8/e3/78/f8e37849-e935-23b5-5846-0dc9a2b90c64/cover.jpg/1440x1440bb.jpg','با تو':'https://i.scdn.co/image/ab67616d0000b273f5f724daa401639517ea0860','خار':'https://i1.sndcdn.com/artworks-SJvEiIXfELCT-0-t1080x1080.jpg','دل من هواتو کرد':'https://www.navahang.com/images/2020/10/Amir-Tataloo-Dele-Man-Havato-Karde-II.jpg'};
let extras=[];let idx=0;const audio=document.getElementById('audio'),list=document.getElementById('list'),now=document.getElementById('now'),meta=document.getElementById('meta'),play=document.getElementById('play'),progress=document.getElementById('progress');function all(){return titles.map(x=>({name:x,url:null})).concat(extras)}function coverFor(name,i){if(realCovers[name])return realCovers[name];const colors=['%230f0f0f','%231a0b20','%230b1724','%231b1607','%230d2018'];const c=colors[i%colors.length];return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' rx='20' fill='${c}'/><circle cx='60' cy='55' r='28' fill='none' stroke='%23fff' stroke-opacity='.35' stroke-width='3'/><text x='60' y='105' fill='%23fff' font-size='12' text-anchor='middle'>TATALOO</text></svg>`)}function render(){list.innerHTML='';all().forEach((t,i)=>{let d=document.createElement('div');d.className='track '+(i===idx?'active':'');let img=t.cover||coverFor(t.name,i);d.innerHTML=`<img class="cover" src="${img}"><span class="info">🎵 ${t.name}<small class="tag"><br>${t.url?'فایل اضافه‌شده':'آماده برای افزودن آهنگ'}</small></span>`;d.onclick=()=>select(i);list.appendChild(d)})}function select(i){idx=i;let t=all()[idx];now.textContent=t.name;meta.textContent=t.url?'فایل شخصی':'برای پخش، فایل آهنگ را با «افزودن آهنگ» اضافه کن';if(t.url){audio.src=t.url;audio.play();play.textContent='⏸'}else{audio.removeAttribute('src');audio.load();play.textContent='▶'}render()}play.onclick=()=>{let t=all()[idx];if(!t.url)return alert('اول فایل آهنگ را با «افزودن آهنگ» اضافه کن.');if(audio.paused){audio.play();play.textContent='⏸'}else{audio.pause();play.textContent='▶'}};document.getElementById('prev').onclick=()=>select((idx-1+all().length)%all().length);document.getElementById('next').onclick=()=>select((idx+1)%all().length);audio.addEventListener('ended',()=>select((idx+1)%all().length));audio.addEventListener('timeupdate',()=>progress.value=audio.duration?audio.currentTime/audio.duration*100:0);progress.oninput=()=>{if(audio.duration)audio.currentTime=progress.value/100*audio.duration};document.getElementById('files').onchange=e=>{[...e.target.files].forEach(f=>extras.push({name:f.name.replace(/\.[^.]+$/,''),url:URL.createObjectURL(f)}));render()};document.getElementById('clear').onclick=()=>{extras=[];if(idx>=titles.length)select(0);else render()};render();select(0);
</script></body></html>
